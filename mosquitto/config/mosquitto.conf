# Konfiguracja brokera Mosquitto – monitoring wnętrza czołgu IoT
#
# Port 1883 – tryb deweloperski (bez TLS, bez hasła) – tylko lokalnie w Dockerze.
# Port 8883 – produkcyjny TLS + uwierzytelnianie (tls.conf).

listener 1883 127.0.0.1
allow_anonymous true

# include_dir musi wskazywać podkatalog (nie ten sam katalog co mosquitto.conf),
# inaczej Mosquitto ładuje mosquitto.conf ponownie i wchodzi w pętlę restartów.
include_dir /mosquitto/config/conf.d

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
