# Listener TLS (MQTT over SSL) – port 8883
# Ścieżki dla obrazu Docker eclipse-mosquitto (volume /mosquitto/certs).
# Na Raspberry Pi 3 skopiuj certyfikaty do /etc/mosquitto/certs/
# i ustaw te same ścieżki w /etc/mosquitto/conf.d/tls.conf.

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
