# Konfiguracja brokera Mosquitto – stacja pogodowa IoT (Docker / eclipse-mosquitto:2)
#
# Port 1883 – plain MQTT, tylko localhost w kontenerze (dev).
# Port 8883 – TLS + uwierzytelnianie (ESP32 ↔ RPi).
#
# Wymagane pliki przed startem (generuj: ./tools/generate_mqtt_certs.sh):
#   mosquitto/certs/ca.crt, server.crt, server.key
#
# NIE dodawaj mosquitto/config/conf.d/ — to jest tylko dla natywnego Mosquitto na RPi.
# NIE używaj include/include_dir w tym katalogu — Mosquitto 2.1 w Dockerze pada na include.

per_listener_settings true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Plain MQTT (tylko wewnątrz kontenera / host localhost) ---
listener 1883 127.0.0.1
allow_anonymous true

# --- MQTT over TLS ---
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd
