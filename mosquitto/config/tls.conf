# Listener TLS (MQTT over SSL) – port 8883
# Docker: ustawienia TLS sa w mosquitto.conf (ten plik NIE jest ladowany przez Docker).
# Na Raspberry Pi 3 (natywny Mosquitto) skopiuj do /etc/mosquitto/conf.d/tls.conf
# i skopiuj certyfikaty do /etc/mosquitto/certs/.

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
