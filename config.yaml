# Konfiguracja bramki Raspberry Pi - stacja pogodowa
# Plik wczytywany przez raspberry/config.py

mqtt:
  host: "localhost"
  port: 8883
  username: "rpi_gateway"
  password: "iot-dev-pass"
  client_id: "rpi-gateway"
  topic_subscribe: "weather/+/data"
  qos: 1
  keepalive: 60
  tls:
    enabled: true
    ca_file: "mosquitto/certs/ca.crt"
    # certfile/keyfile: opcjonalnie dla mTLS
    insecure: false

database:
  path: "data/weather.db"
  history_limit: 500

web:
  host: "0.0.0.0"
  port: 8000
  title: "Stacja Pogodowa - IoT"

nodes:
  - id: "esp32-01"
    name: "Salon"
  - id: "esp32-02"
    name: "Sypialnia"
  - id: "esp32-03"
    name: "Balkon"
