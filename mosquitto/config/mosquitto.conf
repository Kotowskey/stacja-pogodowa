# Konfiguracja brokera Mosquitto – stacja pogodowa IoT
#
# Port 1883 – tryb deweloperski (bez TLS, bez hasła) – tylko lokalnie w Dockerze.
# Port 8883 – produkcyjny TLS + uwierzytelnianie (tls.conf).

listener 1883 127.0.0.1
allow_anonymous true

# Nie używaj include_dir na tym samym katalogu co mosquitto.conf —
# Mosquitto ładuje wtedy pliki .conf ponownie i pada w pętli restartów.
include /mosquitto/config/tls.conf

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
